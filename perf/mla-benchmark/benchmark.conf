# MLA Performance Benchmark Configuration
# =========================================

# Total events to produce per option
NUM_EVENTS=5000000

# Event payload size range (bytes). Actual size is random uniform in [MIN, MAX].
EVENT_SIZE_MIN=200
EVENT_SIZE_MAX=300

# Number of distinct event-id values (1..N)
NUM_EVENT_IDS=4

# JVM heap sizes
BROKER_HEAP=2g
PRODUCER_HEAP=1g
CONSUMER_HEAP=512m

# Topic configuration
PARTITIONS=6
REPLICATION_FACTOR=1

# Reporting interval (ms) for progress output
REPORT_INTERVAL_MS=5000

# Broker port
BROKER_PORT=9092

# Data directory (will be wiped between options)
DATA_DIR=/tmp/mla-benchmark-data

# Results directory
RESULTS_DIR=perf/mla-benchmark/results

# Consumer ID Registry topic
REGISTRY_TOPIC=_consumer_id_registry

# Warmup events (excluded from steady-state stats)
WARMUP_EVENTS=500000

# Producer throughput limit (-1 = unlimited)
PRODUCER_THROUGHPUT=-1

# Producer batch and linger settings for high throughput
PRODUCER_BATCH_SIZE=65536
PRODUCER_LINGER_MS=5
